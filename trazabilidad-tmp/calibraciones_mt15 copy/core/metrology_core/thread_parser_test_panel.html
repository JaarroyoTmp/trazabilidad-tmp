<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>TMP MT16 Parser Test</title>
<style>body{font-family:Arial;background:#07111f;color:#e7f2fb;margin:0;padding:24px}.card{background:#10243a;border:1px solid #24425f;border-radius:14px;padding:16px;margin-bottom:14px}input{background:#071426;color:white;border:1px solid #24425f;border-radius:10px;padding:10px;min-width:320px}button{background:#3d9cff;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid #24425f;padding:8px;text-align:left;font-size:13px}th{background:#183b60}.ok{color:#2bd47c;font-weight:bold}.bad{color:#ff6b6b;font-weight:bold}pre{background:#050b14;border:1px solid #24425f;border-radius:10px;padding:12px;overflow:auto}</style></head>
<body><h1>TMP MT16 Thread Parser Test</h1><div class="card"><input id="txt" value="M14 x 1.5 - 6H"><button id="btn">Probar</button><button id="batch">Bateria TMP</button></div>
<div class="card"><table><thead><tr><th>Estado</th><th>Entrada</th><th>Familia</th><th>Nominal</th><th>Paso</th><th>TPI</th><th>Clase</th><th>Sentido</th><th>Fuente</th><th>Mensaje</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card"><h3>JSON ultimo resultado</h3><pre id="json">{}</pre></div>
<script type="module">
import { parseThreadGaugeDesignation } from "./thread_parser_engine.js";
const examples=["M14 x 1.5 - 6H","M16X1.5","M12-6H","M22 - 6H","M82X2 6H","M18 x 1.5 - 6H IZQ","26 x 1.5 SH8","M9 MB x 1 SH8","5/8 - 11 UNC - 2B","3/4-16 UNF-2B","G1/4-19","G 7/8-14","R3/4-14","1/8 - 27 NPTF","1/4 BSW","5/8 - 11 BSW - NORMAL"];
function render(result,input){document.querySelector("#json").textContent=JSON.stringify(result,null,2);document.querySelector("#rows").insertAdjacentHTML("afterbegin",`<tr><td class="${result.ok?"ok":"bad"}">${result.ok?"OK":"ERROR"}</td><td>${input}</td><td>${result.family||"-"}</td><td>${result.nominal_mm??"-"}</td><td>${result.pitch_mm??"-"}</td><td>${result.tpi??"-"}</td><td>${result.tolerance_class||"-"}</td><td>${result.direction||"-"}</td><td>${result.standard_source||result.source||"-"}</td><td>${result.message||(result.warnings||[]).join(" · ")||"OK"}</td></tr>`)}
document.querySelector("#btn").addEventListener("click",()=>{const input=document.querySelector("#txt").value;render(parseThreadGaugeDesignation({rango:input}),input)});
document.querySelector("#batch").addEventListener("click",()=>{document.querySelector("#rows").innerHTML="";for(const input of examples)render(parseThreadGaugeDesignation({rango:input}),input)});
</script></body></html>
